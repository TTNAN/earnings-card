<style>
:root{--paper:#F3F0EA;--ink:#151515;--mute:#6F6A60;--line:#D9D3C7;--gold:#8C6A3F}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Inter","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 80px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;border-bottom:2px solid var(--ink);padding-bottom:20px;flex-wrap:wrap}
h1{font-size:44px;line-height:1.05;margin:0;letter-spacing:-.02em}
.sub{color:var(--mute);margin:10px 0 0;max-width:640px}
.ctrl{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 16px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--paper)}
a.gh{font-size:14px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff8}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 8px}
nav a{font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:8px;background:#fff6;border:1px solid var(--line)}
nav a:hover{border-color:var(--ink)}
section{padding-top:36px}
.co{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.co h2{margin:0;font-size:28px}.co span{color:var(--mute);font-size:14px}
.co p{flex-basis:100%;margin:2px 0 14px;font-size:18px;font-weight:600}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scroll-snap-type:x mandatory}
.row img{height:360px;width:auto;border-radius:10px;box-shadow:0 1px 0 var(--line),0 8px 24px #0000000f;cursor:zoom-in;scroll-snap-align:start;background:#fff;flex:none}
.row img.wide{height:360px}
#lb{position:fixed;inset:0;background:#151515e6;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:94vw;max-height:92vh;border-radius:8px}
footer{margin-top:56px;border-top:1px solid var(--line);padding-top:18px;color:var(--mute);font-size:13px}
footer code{background:#fff;padding:2px 6px;border-radius:4px}
@media(max-width:640px){h1{font-size:32px}.row img,.row img.wide{height:260px}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div><h1 id="t"></h1><p class="sub" id="s"></p></div>
 <div class="ctrl"><div class="seg"><button data-l="zh">中文</button><button data-l="en">EN</button></div><a class="gh" id="gen" href="../">生成器</a><a class="gh" href="https://github.com/TTNAN/earnings-card">★ GitHub</a></div>
</header>
<nav id="nav"></nav>
<main id="m"></main>
<footer id="f"></footer>
</div>
<div id="lb"><img alt=""></div>
<script src="data.js"></script>
<script>
const T={zh:{t:"七巨头财报卡画廊",s:"苹果、微软、谷歌、亚马逊、英伟达、Meta、特斯拉最新一季财报，每家一整套卡片，全部由 earnings-card 从 SEC 官方财报自动生成。点图放大，横向滑动看全套。",f:"数据来自 SEC EDGAR（GAAP 口径），不构成投资建议。自己生成：在 Claude Code / Codex 里装上 skill，说一句「给 NVDA 做一套财报卡」。 <code>npx skills add TTNAN/earnings-card</code>",lang:"zh-CN"},
en:{t:"Mag 7 earnings cards",s:"The latest quarter for Apple, Microsoft, Alphabet, Amazon, NVIDIA, Meta and Tesla, one full set each, all generated by earnings-card from official SEC filings. Click to enlarge, scroll sideways for the whole set.",f:"Data from SEC EDGAR (GAAP). Not investment advice. Make your own: install the skill in Claude Code or Codex and say \"Make an earnings card for NVDA\". <code>npx skills add TTNAN/earnings-card</code>",lang:"en"}};
const E=window.EC,order=["NVDA","MSFT","AAPL","GOOGL","AMZN","META","TSLA"];
function draw(l){
 document.documentElement.lang=T[l].lang;gen.textContent=l=='zh'?'在线生成器 →':'Make your own →';gen.href=l=='zh'?'../':'../?ui=en';t.textContent=T[l].t;s.textContent=T[l].s;f.innerHTML=T[l].f;
 document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.l==l));
 nav.innerHTML=order.map(k=>`<a href="#${k}">${k}</a>`).join('');
 m.innerHTML=order.map(k=>`<section id="${k}"><div class="co"><h2>${k}</h2><span>${E.co[k]} · ${E.fl[k]}</span><p>${E.heads[l][k]||''}</p></div><div class="row">${E.cards[l][k].map(x=>`<img loading="lazy" class="${/wide/.test(x)?'wide':''}" src="cards/${l}/${x}" alt="${k} ${x}">`).join('')}</div></section>`).join('');
 localStorage.ecl=l;
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>draw(b.dataset.l));
m.onclick=e=>{if(e.target.tagName=='IMG'){lb.querySelector('img').src=e.target.src;lb.style.display='flex'}};
lb.onclick=()=>lb.style.display='none';document.onkeydown=e=>{if(e.key=='Escape')lb.style.display='none'};
draw(new URLSearchParams(location.search).get('lang')||localStorage.ecl||(navigator.language.startsWith('zh')?'zh':'en'));
</script>
</body>
</html>
