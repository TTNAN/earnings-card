<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>earnings-card · 财报卡生成器</title>
<meta name="description" content="输入美股代码，选季报或年报（可选历史财年/季度）、风格、比例和水印，在浏览器里即时生成财报卡。数据来自 SEC EDGAR。Type a US ticker and get shareable earnings cards instantly.">
<meta property="og:title" content="earnings-card · 财报卡生成器">
<meta property="og:description" content="Type a ticker, get a set of earnings cards from SEC filings. Free, open source, runs in your browser.">
<meta property="og:image" content="https://ttnan.github.io/earnings-card/gallery/cards/en/NVDA-7-wide.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- the card fonts: canvas measures with them, the preview draws with them, PNG export embeds subsets of them -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=Source+Serif+4:wght@400;500;600;700;800&family=Noto+Serif+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./"><b>earnings-card</b><span data-i="brand"></span></a>
  <nav>
    <a href="tickers/" id="navTickers" data-i="tickerList"></a>
    <a href="gallery/" data-i="gallery"></a>
    <a href="https://github.com/TTNAN/earnings-card" target="_blank" rel="noopener">GitHub</a>
    <div class="seg small" id="uilang"><button data-v="zh">中文</button><button data-v="en">EN</button></div>
  </nav>
</header>

<div class="app">
  <aside class="panel" id="panel">
    <h1 data-i="title"></h1>
    <p class="lede" data-i="lede"></p>

    <div class="field">
      <label for="ticker" class="lab" data-i="ticker"></label>
      <div class="tkrow">
        <div class="ac">
          <input id="ticker" autocomplete="off" spellcheck="false" maxlength="12" value="NVDA" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false">
          <ul id="sugg" role="listbox" hidden></ul>
        </div>
        <button class="primary go" id="go" data-i="generate"></button>
      </div>
      <p id="tkerr" class="tkerr" role="alert" hidden></p>
      <p id="tknote" class="tknote" hidden></p>
      <div id="recent" class="recent" hidden></div>
      <small id="coverage" class="hint"></small>
    </div>

    <div class="field"><span data-i="period"></span>
      <div class="seg" id="period"><button data-v="quarter" data-i="quarter"></button><button data-v="annual" data-i="annual"></button></div>
      <div class="pp" id="pp" hidden>
        <label><small id="fyLab"></small><select id="fy"></select></label>
        <label><small id="fqLab"></small><select id="fq"></select></label>
      </div>
    </div>

    <div class="field"><span data-i="ratio"></span>
      <div class="seg" id="ratio"><button data-v="4:5">4:5</button><button data-v="1:1">1:1</button><button data-v="9:16">9:16</button><button data-v="16:9">16:9</button></div>
      <small class="hint" id="ratiohint"></small>
    </div>

    <div class="field"><span data-i="style"></span>
      <div class="swatches" id="styles"></div>
    </div>

    <div class="field"><span data-i="cardLang"></span>
      <div class="seg" id="lang"><button data-v="zh">中文</button><button data-v="en">English</button></div>
    </div>

    <div class="field"><label for="headline" class="lab" data-i="headline"></label>
      <input id="headline" maxlength="60" data-ph="headlinePh">
      <div class="ideas" id="ideas" hidden></div>
      <small class="hint" data-i="headlineHint"></small>
    </div>

    <div class="field"><span data-i="cards"></span>
      <div class="checks" id="cards"></div>
    </div>

    <details class="more" id="more">
      <summary data-i="more"></summary>

      <div class="field"><span data-i="extraCards"></span>
        <div class="checks" id="cards2"></div>
      </div>

      <div class="field"><span data-i="font"></span>
        <div class="seg" id="font"><button data-v="auto" data-i="fAuto"></button><button data-v="sans" data-i="fSans"></button><button data-v="serif" data-i="fSerif"></button><button data-v="mono" data-i="fMono"></button></div>
      </div>

      <div class="field"><span data-i="watermark"></span>
        <div class="wm">
          <input id="handle" maxlength="40" data-ph="handlePh">
          <label class="avatar" id="avatarBtn" title=""><input type="file" id="avatar" accept="image/*" hidden><img id="avatarImg" alt="" hidden><span data-i="avatar"></span></label>
          <button class="link" id="avatarClear" hidden data-i="remove"></button>
        </div>
      </div>

      <div class="field" id="custom"><span data-i="customColors"></span>
        <div class="colors">
          <label><input type="checkbox" data-c="bg"><span data-i="cBg"></span><input type="color" id="c-bg"></label>
          <label><input type="checkbox" data-c="ink"><span data-i="cInk"></span><input type="color" id="c-ink"></label>
          <label><input type="checkbox" data-c="hi"><span data-i="cHi"></span><input type="color" id="c-hi"></label>
          <label><input type="checkbox" data-c="a2"><span data-i="cA2"></span><input type="color" id="c-a2"></label>
          <label class="toggle"><input type="checkbox" id="updown"><span data-i="cUpdown"></span></label>
        </div>
        <small class="hint warn" id="cwarn" hidden></small>
      </div>

      <div class="field"><span data-i="presets"></span>
        <div class="presets">
          <select id="presetSel"></select>
          <button class="ghost" id="presetSave" data-i="presetSave"></button>
          <button class="link" id="presetDel" data-i="remove" hidden></button>
        </div>
      </div>
    </details>
  </aside>

  <main class="preview" id="preview">
    <div class="bar">
      <div id="meta" class="meta"></div>
      <div class="acts">
        <button class="ghost" id="copyCap" disabled data-i="copyCaption"></button>
        <button class="primary" id="zip" disabled data-i="downloadAll"></button>
      </div>
    </div>
    <details class="capbox" id="capbox" hidden><summary data-i="captionShow"></summary><textarea id="caption" rows="8" spellcheck="false"></textarea></details>
    <div id="status" class="status" role="status" aria-live="polite"><div class="spinner"></div>
      <div class="stx"><p id="statusText"></p><div class="prog" id="prog" hidden><i id="progBar"></i></div></div>
      <button class="ghost" id="retry" hidden data-i="retry"></button>
    </div>
    <div id="grid" class="grid"></div>
    <footer class="foot" data-i="foot"></footer>
  </main>
</div>
<button class="jump" id="jump" hidden data-i="jump"></button>
<div class="toast" id="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
